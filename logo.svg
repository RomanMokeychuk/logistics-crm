  <circle cx="21" cy="41" r="4.6" fill="#c9973a" stroke="#3a4244" stroke-width="3"/>
  <circle cx="34" cy="41" r="4.6" fill="#c9973a" stroke="#3a4244" stroke-width="3"/>
  <circle cx="50" cy="41" r="4.6" fill="#c9973a" stroke="#3a4244" stroke-width="3"/>
  <!-- Дорога -->
