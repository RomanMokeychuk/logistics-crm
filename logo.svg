<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Logo</title>
  <defs>
    <!-- Металеве золото Grandar -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset=".35" stop-color="#e9c46a"/>
      <stop offset=".7" stop-color="#c9973a"/>
      <stop offset="1" stop-color="#8f6a1f"/>
    </linearGradient>
    <!-- Глянець зверху -->
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <rect width="64" height="64" rx="14" fill="url(#s)"/>
  <!-- Лінії швидкості -->
  <path d="M5 22h6M3 29h8M6 36h5" fill="none" stroke="#3a4244" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
