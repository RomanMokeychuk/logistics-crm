<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>FURA — Клієнти</title>
        <style>
            body {
                visibility: hidden;
            }
        </style>
        <link rel="icon" href="favicon.ico?v=3" sizes="any" />
        <link rel="icon" href="logo.svg?v=3" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="apple-touch-icon.png?v=3" />
        <link rel="preconnect" href="https://prbfscwmemshwigiftha.supabase.co" crossorigin />
        <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
        <link rel="preconnect" href="https://unpkg.com" crossorigin />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
        <link rel="stylesheet" href="style.css?v=202611131114" />
        <link rel="stylesheet" href="requests.css?v=202611131114" />
        <link rel="stylesheet" href="deals.css?v=202611131114" />
        <link rel="stylesheet" href="leads.css?v=202611131114" />
        <link rel="stylesheet" href="clients.css?v=202611131114" />
        <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="theme.css?v=202611131114" />
        <link rel="stylesheet" href="design.css?v=202611131114" />
    </head>
    <body>
        <aside class="sidebar"></aside>
        <script>/* FURA: меню з пам'яті вкладки — одразу, без «блимання» (shell.js потім оновить його) */try{var a=document.querySelector("aside.sidebar"),h=sessionStorage.getItem("fura_sb");if(a&&h&&innerWidth>900){a.innerHTML=h;a.classList.add("fura-sidebar");var p=(location.pathname.split("/").pop()||"index.html").toLowerCase();a.querySelectorAll(".fura-nav-item.active").forEach(function(x){x.classList.remove("active")});var l=a.querySelector('.fura-nav-item[href="'+p+'"]');if(l)l.classList.add("active");var n=a.querySelector(".fura-nav");if(n)n.scrollTop=+sessionStorage.getItem("fura_nav_scroll")||0}}catch(e){}</script>

        <button type="button" id="sidebarToggleBtn" class="sidebar-toggle-btn" onclick="toggleSidebar()" title="Сховати/показати бічну панель">
            <i class="bx bx-chevron-left"></i>
        </button>

        <main class="main-content">
            <div id="clientsListView" class="deals-list-view">
            <header class="top-bar">
                <h1>Клієнти</h1>
                <button class="btn btn-primary" id="newClientBtn"><i class="bx bx-plus"></i> Новий клієнт</button>
            </header>

            <div class="filters-bar lead-filters">
                <input type="text" id="clientsSearch" class="search-input" placeholder="🔍 Пошук: назва, ЄДРПОУ, контакт, телефон, пошта, адреса, вантаж..." />
                <select id="clientsTradeFilter" class="lead-select">
                    <option value="">Імпорт / експорт</option>
                    <option value="Експорт">Експорт</option>
                    <option value="Імпорт">Імпорт</option>
                    <option value="По Україні">По Україні</option>
                </select>
                <select id="clientsSalesFilter" class="lead-select"></select>
            </div>

            <section class="table-card" id="tableScrollArea">
                <table class="requests-table clients-table">
                    <thead>
                        <tr>
                            <th>Клієнт / код</th>
                            <th>Менеджер</th>
                            <th>Контакти</th>
                            <th>Напрямок</th>
                            <th>Що возить / виробляє</th>
                            <th>Угоди</th>
                            <th style="width: 60px"></th>
                        </tr>
                    </thead>
                    <tbody id="clientsTableBody"></tbody>
                </table>
            </section>
            <div id="clientsCountBar" class="carriers-count-bar"></div>
            </div>
            <div id="clientDetailView" class="deal-view" hidden></div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="address-suggest.js?v=202611131114"></script>
        <script src="clients.js?v=202611131114"></script>
        <script src="portal-admin.js?v=202611131114"></script>
        <script src="comms-card.js?v=202611131114"></script>
        <script src="shell.js?v=202611131114"></script>
        <script src="notify.js?v=202611131114"></script>
        <script src="lock.js?v=202611131114"></script>
    </body>
</html>
