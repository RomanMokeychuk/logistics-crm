<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>FURA</title>
        <script>
            // Адреса сайту без сторінки → Головна. Старі посилання «index.html?open=…» → Перевізники.
            (function () {
                var s = location.search, h = location.hash;
                location.replace(s && s !== "?" ? "carriers.html" + s + h : "home.html" + h);
            })();
        </script>
    </head>
    <body></body>
</html>
