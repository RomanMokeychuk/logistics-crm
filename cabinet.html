<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="robots" content="noindex" />
        <title>Кабінет Грандар</title>
        <link rel="icon" href="favicon.ico" />
        <link rel="apple-touch-icon" href="apple-touch-icon.png" />
        <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="cabinet.css?v=202611022150" />
        <script src="https://telegram.org/js/telegram-web-app.js"></script>
    </head>
    <body>
        <header class="cb-top" id="cbTop" hidden>
            <img src="company-logo.svg" alt="" class="cb-logo" />
            <div class="cb-who">
                <div class="cb-company" id="cbCompany"></div>
                <div class="cb-role" id="cbRole"></div>
            </div>
            <button type="button" class="cb-icon-btn" id="cbLogout" title="Вийти"><i class="bx bx-log-out"></i></button>
        </header>
        <main id="app" class="cb-main">
            <div class="cb-loading"><i class="bx bx-loader-alt bx-spin"></i> Завантаження…</div>
        </main>
        <div class="cb-toast" id="cbToast" hidden></div>
        <script src="cabinet.js?v=202611022150"></script>
    </body>
</html>
